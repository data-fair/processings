name: Quality checks

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build types
      run: npm run build-types

    - name: Type check
      run: npm run check-types

    - name: Build UI
      run: npm -w ui run build

    - name: Init .env
      run: ./node_modules/.bin/df-dev init-env # local bin only: a bare npx would fetch an unrelated "df-dev" from the registry if the dependency were missing

    - name: Use localhost as DEV_HOST in CI
      run: sed -i 's/^DEV_HOST=.*/DEV_HOST=localhost/' .env

    - name: Start the core docker compose services (optional ones stay off, like a default dev env)
      run: docker compose up -d --wait

    - name: Start dev API
      run: NODE_CONFIG="$(./node_modules/.bin/df-dev absent-config)" ./node_modules/.bin/dotenv -- npm -w api run dev &

    - name: Start dev worker
      run: NODE_CONFIG="$(./node_modules/.bin/df-dev absent-config)" ./node_modules/.bin/dotenv -- npm -w worker run dev &

    - name: Wait for dev API to be ready
      run: |
        set -a; source .env; set +a
        for i in {1..30}; do
          curl -sf "http://localhost:${DEV_API_PORT}/api/v1/_ping" && exit 0
          sleep 2
        done
        echo "dev API did not become ready" >&2
        exit 1

    - name: Run tests
      run: npm run test-unit && npm run test-api

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Stop docker compose services
      if: always()
      run: docker compose --profile '*' down
